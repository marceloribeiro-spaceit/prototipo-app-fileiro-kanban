<x-dc>
<helmet><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet"><style>html,body{margin:0;height:100%}

button{font-family:inherit;cursor:pointer}
a{color:#004f9f}</style></helmet>
<div style="min-height:100%;display:flex;flex-direction:column;gap:20px;padding:24px 16px 40px;box-sizing:border-box">
  <div style="max-width:1218px;width:100%;margin:0 auto;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px">

      <span style="font-size:12px;font-weight:800;letter-spacing:.14em;color:#004f9f">MARIMEX · APP DO FILEIRO</span>
